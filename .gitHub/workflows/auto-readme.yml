name: Auto README

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # Runs daily 7am Lagos time to update CBN rate
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install --no-audit --no-fund
      - run: node scripts/generate-readme.js
      - run: |
          if [[ -n $(git status --porcelain README.md) ]]; then
            git config user.name "NGN Chain Bot"
            git config user.email "bot@ngn-chain.onrender.com"
            git add README.md
            git commit -m "auto: update README with live CBN ${{ github.run_id }}"
            git push
          else
            echo "No changes"
          fi