name: Auto README

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: npm install --no-audit --no-fund || true

      - name: Generate README
        run: node scripts/generate-readme.js

      - name: Commit if changed
        run: |
          if [[ -n $(git status --porcelain README.md) ]]; then
            git config user.name "NGN Chain Bot"
            git config user.email "bot@ngn-chain.onrender.com"
            git add README.md
            git commit -m "auto: update README live rate"
            git push
          else
            echo "No changes to README"
          fi
