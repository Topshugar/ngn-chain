<h1>NGN Miner - Satoshi Mode</h1>
<input id="addr" placeholder="Your wallet 0x..."/>
<button onclick="start()">Start Mining on Phone</button>
<p id="status"></p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<script>
let mining=false;
async function start(){
  mining=true;
  const addr=document.getElementById('addr').value;
  let nonce=0;
  const parentRes=await fetch('/api/difficulty').then(r=>r.json());
  let diff=parentRes.difficulty;
  
  while(mining){
    const hash = ethers.keccak256(ethers.toUtf8Bytes(`${parentRes.blockHeight}xxx${nonce}${Date.now()}`));
    if(hash.startsWith('0x'+'0'.repeat(diff))){
      const res=await fetch('/api/mine',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({miner:addr,nonce})}).then(r=>r.json());
      document.getElementById('status').innerText=`Mined! Block ${res.block.number} +50 NGN ${hash}`;
      break;
    }
    nonce++;
    if(nonce%5000==0) document.getElementById('status').innerText=`Hashing... ${nonce} hashes`;
  }
}
</script>
