<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><title>NGN Miner</title></head>
<body style="font-family:sans-serif;padding:20px;background:#111;color:#0f0">
<h2>⛏️ NGN Chain 777 Miner (Satoshi)</h2>
<input id="addr" style="width:100%;padding:10px" placeholder="0x your wallet"/>
<button onclick="start()" style="width:100%;padding:15px;margin-top:10px;background:#0f0;font-weight:bold">START MINING</button>
<button onclick="stop()" style="width:100%;padding:10px;margin-top:5px">STOP</button>
<pre id="log" style="margin-top:20px;background:#000;padding:10px;white-space:pre-wrap"></pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js"></script>
<script>
let mining=false;
async function start(){
  const addr=document.getElementById('addr').value.trim();
  if(!/^0x[a-fA-F0-9]{40}$/.test(addr)) return alert('Invalid address');
  mining=true; log(`Mining for ${addr}...`);
  let diffInfo=await fetch('/api/difficulty').then(r=>r.json());
  log(`Difficulty: ${diffInfo.difficulty} zeros | Height: ${diffInfo.blockHeight} | Reward: ${diffInfo.reward}`);
  let nonce=0;
  while(mining){
    const parent=diffInfo.parentHash;
    const ts=Math.floor(Date.now()/1000);
    const hash=ethers.keccak256(ethers.toUtf8Bytes(`${diffInfo.blockHeight}${parent}${nonce}${ts}`));
    if(hash.startsWith('0x'+'0'.repeat(diffInfo.difficulty))){
      log(`FOUND! ${hash} nonce=${nonce} -> submitting...`);
      const res=await fetch('/api/mine',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({miner:addr,nonce})}).then(r=>r.json());
      if(res.success){
        log(`✅ BLOCK ${res.block.number} MINED! +${res.reward} | New Balance: ${res.newBalance} NGN | Hash: ${res.hash}`);
        diffInfo=await fetch('/api/difficulty').then(r=>r.json());
      } else {
        log(`❌ Rejected: ${res.error} - retrying`);
        diffInfo=await fetch('/api/difficulty').then(r=>r.json());
      }
      nonce=0; continue;
    }
    nonce++;
    if(nonce%20000===0) log(`Hashing... ${nonce} attempts | last hash ${hash.slice(0,20)}...`);
    await new Promise(r=>setTimeout(r,0));
  }
}
function stop(){ mining=false; log('Stopped'); }
function log(m){ document.getElementById('log').innerText=m+'\n'+document.getElementById('log').innerText; }
</script>
</body>
</html>
