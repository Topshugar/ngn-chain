<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>NGN Chain 777 - Official</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
:root{--gold:#FFD700;--bg:#071a13;--card:#102a22;--muted:#7ea294}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#134e39 0%,var(--bg) 60%);color:#fff;font-family:Inter,system-ui,Segoe UI,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:420px}.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--gold);display:grid;place-items:center;color:var(--bg);font-weight:900}
.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,215,0,.25);border-radius:20px;padding:22px;backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.4)}
h1{font-size:22px;margin:8px 0 4px}.sub{color:var(--muted);font-size:13px;letter-spacing:.02em}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,215,0,.3),transparent);margin:18px 0}
.btn{width:100%;height:52px;border-radius:14px;border:0;font-weight:800;font-size:16px;cursor:pointer;transition:.2s}
.btn-gold{background:var(--gold);color:var(--bg)}.btn-gold:active{transform:scale(.98)}
.btn-ghost{background:transparent;border:1px solid rgba(255,215,0,.35);color:var(--gold);margin-top:10px}
.status{margin-top:14px;font-size:13px;min-height:18px}.ok{color:#3dffa0}.err{color:#ff6b6b}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:14px}
code{background:rgba(255,255,255,.07);padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo">N</div><div><div style="font-weight:800">NGN CHAIN</div><div class="sub">Chain ID 777 • Lagos</div></div></div>
  <div class="card">
    <h1>Add NGN Chain 777</h1>
    <div class="sub">One-tap add to MetaMask. Must be opened inside MetaMask Browser.</div>
    <div class="divider"></div>
    <button class="btn btn-gold" id="addBtn">Add to MetaMask</button>
    <button class="btn btn-ghost" onclick="location.href='/trader'">Open Trader →</button>
    <div id="status" class="status"></div>
    <div class="meta"><span>RPC: <code>ngn-chain.onrender.com</code></span><span>0x309</span></div>
  </div>
</div>
<script>
const CHAIN_PARAMS = {
  chainId: '0x309',
  chainName: 'NGN Chain 777',
  nativeCurrency: { name: 'NGN', symbol: 'NGN', decimals: 18 },
  rpcUrls: ['https://ngn-chain.onrender.com'],
  blockExplorerUrls: ['https://ngn-chain.onrender.com/explorer/']
};
const $status = document.getElementById('status');
const $btn = document.getElementById('addBtn');
async function addChain(){
  if(!window.ethereum){ $status.className='status err'; $status.textContent='Open this page inside MetaMask → Browser tab'; return; }
  $btn.textContent='Connecting...'; $btn.disabled=true;
  try{
    await window.ethereum.request({ method:'wallet_addEthereumChain', params:[CHAIN_PARAMS] });
    $status.className='status ok'; $status.textContent='✅ Added & Switched to NGN Chain 777';
    $btn.textContent='Added ✓';
  }catch(e){
    $status.className='status err';
    if(e.code===4902) $status.textContent='Already added — switch to NGN Chain 777 in wallet';
    else $status.textContent=e.message||'Failed to add chain';
    $btn.textContent='Add to MetaMask'; $btn.disabled=false;
  }
}
$btn.addEventListener('click', addChain);
</script>
</body>
</html>
