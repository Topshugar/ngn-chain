<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NGN Chain 777 • Faucet</title>
<style>
:root{--bg:#080808;--card:#111;--border:#1e1e1e;--muted:#888;--green:#00c076}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px}
h1{font-size:20px;letter-spacing:-0.4px} .sub{font-size:12px;color:var(--muted);margin:6px 0 18px}
.logo-wrap{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--green),#009624);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:white}
.stats{display:flex;gap:10px;margin-bottom:18px}
.stat{flex:1;background:#0f0f0f;border:1px solid var(--border);border-radius:12px;padding:10px}
.stat label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat b{font-size:13px}
.input{width:100%;padding:13px;background:#0a0a0a;border:1px solid var(--border);border-radius:12px;color:#fff;font-size:14px;outline:none}
.btn{width:100%;margin-top:12px;padding:13px;background:#fff;color:#000;border:0;border-radius:12px;font-weight:650;font-size:14px;cursor:pointer}
.btn:disabled{opacity:.5}
.msg{margin-top:12px;font-size:12px;color:var(--muted);word-break:break-all;line-height:1.4;min-height:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top a{font-size:12px;color:#888;text-decoration:none;border:1px solid var(--border);padding:6px 10px;border-radius:8px}
ul{margin-top:16px;padding-left:16px;color:var(--muted);font-size:12px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
<div class="logo-wrap"><div class="logo-icon">₦</div><div><h1>NGN Chain 777</h1><div class="sub" style="margin:0">FAUCET • 100 NGN</div></div></div>
<div class="top">
<div>
<div class="sub" style="margin:0">100 NGN per claim • Chain 777</div>
</div>
<a href="/">Home</a>
</div>

<div class="stats">
<div class="stat"><label>Chain ID</label><b>777</b></div>
<div class="stat"><label>Block</label><b id="block">—</b></div>
<div class="stat"><label>Status</label><b id="status">—</b></div>
</div>

<input id="addr" class="input" placeholder="0x..." autocomplete="off" spellcheck="false" />
<button id="btn" class="btn" onclick="claim()">Claim 100 NGN</button>
<div id="msg" class="msg"></div>

<ul>
<li>Rate limited: 1 claim per address per block</li>
<li>Native token: NGN (18 decimals)</li>
<li>RPC: / (POST)</li>
</ul>
</div>

<script>
async function load(){
 try{
  const r=await fetch('/api/stats'); const j=await r.json();
  document.getElementById('block').innerText=j.blockNumber;
  document.getElementById('status').innerText='Active';
 }catch{
  document.getElementById('status').innerText='Offline';
 }
}
async function claim(){
 const addr=document.getElementById('addr').value.trim();
 const msg=document.getElementById('msg');
 const btn=document.getElementById('btn');
 if(!/^0x[a-fA-F0-9]{40}$/.test(addr)){ msg.innerText='Invalid address'; return; }
 btn.disabled=true; btn.innerText='Processing...'; msg.innerText='';
 try{
  const res=await fetch('/faucet',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address:addr})});
  const data=await res.json();
  msg.innerText = data.success ? `Success\nTx: ${data.txHash}` : `Error: ${data.error}`;
  if(data.success) load();
 }catch{ msg.innerText='Network error'; }
 finally{ btn.disabled=false; btn.innerText='Claim 100 NGN'; }
}
load();
</script>
</body>
</html>
