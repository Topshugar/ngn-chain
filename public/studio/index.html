<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NGN Studio 777 - Special Wallet</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#08080a;color:#eee;font-family:'Inter',sans-serif}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#000;border-bottom:1px solid #1a1a1a;position:sticky;top:0;z-index:10}
.brand{font-family:'JetBrains Mono';font-weight:700}.brand span{color:#b7ff00}
.badge{font-family:'JetBrains Mono';font-size:10px;border:1px solid #222;background:#111;padding:6px 10px;border-radius:999px}
.tabs{display:flex;gap:8px;margin:14px}.tab{flex:1;padding:12px;border-radius:10px;border:1px solid #222;background:#111;color:#888;font-family:'JetBrains Mono';font-size:11px;font-weight:700;cursor:pointer;text-align:center}.tab.active{background:#b7ff00;color:#000;border-color:#b7ff00}
.panel{display:none;margin:0 14px}.panel.active{display:block}
.card{border:1px solid #1e1e1e;background:#111;border-radius:12px;padding:14px;margin-bottom:10px}
.label{font-size:9px;color:#666;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.value{font-family:'JetBrains Mono';font-size:12px;word-break:break-all;background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:10px}
.btn{border-radius:10px;padding:12px;font-family:'JetBrains Mono';font-weight:700;font-size:11px;cursor:pointer;border:1px solid #222;background:#171717;color:#fff;width:100%;margin-top:8px}
.btn.primary{background:#b7ff00;color:#000;border-color:#b7ff00}.btn.small{padding:8px 10px;font-size:10px;width:auto;display:inline-block;margin-right:6px}
#editor{height:32vh;border:1px solid #1e1e1e;border-radius:12px;overflow:hidden}.controls{display:flex;gap:8px;margin-top:10px}.controls button{flex:1;border-radius:12px;padding:12px;font-family:'JetBrains Mono';font-weight:700;font-size:11px;background:#171717;color:#fff;border:1px solid #222;cursor:pointer}
#log{margin:14px;background:#101010;border:1px solid #1e1e1e;border-radius:12px;padding:12px;height:20vh;overflow:auto;font-family:'JetBrains Mono';font-size:11px;color:#aaa;white-space:pre-wrap}
.hint{padding:10px;border-radius:8px;background:#b7ff0015;border:1px solid #b7ff0030;font-size:11px;color:#c6e57a;margin-bottom:10px}
.tag{display:inline-block;background:#b7ff00;color:#000;font-family:'JetBrains Mono';font-size:9px;padding:3px 8px;border-radius:999px;font-weight:700;margin-left:6px}
</style>
</head>
<body>
<div class="header"><div class="brand">NGN CHAIN <span>[777]</span></div><div class="badge" id="status">NOT CONNECTED</div></div>
<div class="tabs"><div class="tab active" onclick="switchTab('deploy')">DEPLOY</div><div class="tab" onclick="switchTab('wallet')">NGN SPECIAL WALLET</div></div>
<div id="panel-deploy" class="panel active"><div id="editor"></div><div class="controls"><button id="connectBtn" onclick="connectWallet()">CONNECT</button><button onclick="compileCode()">COMPILE</button><button onclick="deployContract()" style="background:#b7ff00;color:#000">DEPLOY</button></div><div id="log">Ready</div></div>
<div id="panel-wallet" class="panel">
<div class="card"><div class="label">NGN Special Wallet Generator <span class="tag">CHAIN 777 ONLY</span></div><div class="hint">Path: <b>m/44'/777'/0'/0/0</b> - Native to NGN Chain, not Ethereum. Different address even with same seed.</div><button class="btn primary" onclick="generateNGNWallet()">GENERATE NGN SPECIAL WALLET</button><button class="btn" onclick="generateBulk()">GENERATE 5 WALLETS FOR USERS</button></div>
<div class="card"><div class="label">Mnemonic - SECRET</div><div class="value" id="w-mnemonic">Click Generate</div><button class="btn small" onclick="copy('w-mnemonic')">COPY</button></div>
<div class="card"><div class="label">NGN Address</div><div class="value" id="w-address">-</div><button class="btn small" onclick="copy('w-address')">COPY</button><button class="btn small" onclick="checkBalance()">CHECK BALANCE</button><button class="btn small" onclick="claimFaucet()" style="background:#b7ff00;color:#000">CLAIM 100 NGN FAUCET</button></div>
<div class="card"><div class="label">Private Key - SECRET</div><div class="value" id="w-pkey">-</div><button class="btn small" onclick="copy('w-pkey')">COPY</button></div>
<div class="card"><div class="label">Bulk</div><div class="value" id="w-bulk">No bulk yet</div></div>
</div>
<script>
let editor,compiled=null,provider,signer,currentWallet=null;
const CHAIN_PARAMS={chainId:'0x309',chainName:'NGN Chain',rpcUrls:['https://ngn-chain.onrender.com'],nativeCurrency:{name:'NGN',symbol:'NGN',decimals:18}};
const NGN_PATH="m/44'/777'/0'/0/0";
const CODE=`// SPDX-License-Identifier: MIT
pragma solidity ^0.8.19;
contract NGNToken { string public name="Naira Token"; string public symbol="NGN"; uint8 public decimals=18; uint256 public totalSupply; address public owner; mapping(address=>uint256) public balanceOf;
    constructor(){owner=msg.sender;totalSupply=1000000000*10**decimals;balanceOf[owner]=totalSupply;}
    function transfer(address to,uint256 amount) public returns(bool){require(balanceOf[msg.sender]>=amount);balanceOf[msg.sender]-=amount;balanceOf[to]+=amount;return true;}}`;
require.config({paths:{vs:'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs'}});
require(['vs/editor/editor.main'],()=>{editor=monaco.editor.create(document.getElementById('editor'),{value:CODE,language:'solidity',theme:'vs-dark',fontSize:12.5,minimap:{enabled:false},automaticLayout:true});});
function switchTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));if(t==='deploy'){document.querySelectorAll('.tab')[0].classList.add('active');document.getElementById('panel-deploy').classList.add('active');}else{document.querySelectorAll('.tab')[1].classList.add('active');document.getElementById('panel-wallet').classList.add('active');}}
function log(m){const el=document.getElementById('log');el.innerHTML+=`\n> ${m}`;el.scrollTop=el.scrollHeight;}
function setStatus(t){document.getElementById('status').innerText=t;}
function copy(id){navigator.clipboard.writeText(document.getElementById(id).innerText);alert('Copied!');}
function generateNGNWallet(){const mnemonic=ethers.utils.entropyToMnemonic(ethers.utils.randomBytes(16));const wallet=ethers.Wallet.fromMnemonic(mnemonic,NGN_PATH);currentWallet=wallet;document.getElementById('w-mnemonic').innerText=mnemonic;document.getElementById('w-address').innerText=wallet.address;document.getElementById('w-pkey').innerText=wallet.privateKey;log('Generated NGN Wallet: '+wallet.address);}
function generateBulk(){let html='';for(let i=0;i<5;i++){const m=ethers.utils.entropyToMnemonic(ethers.utils.randomBytes(16));const w=ethers.Wallet.fromMnemonic(m,`m/44'/777'/0'/${i}/0`);html+=`<div style="border-bottom:1px solid #222;padding:6px 0"><b>${i+1}. ${w.address}</b><br><span style="color:#666;font-size:10px">${m}</span></div>`;}document.getElementById('w-bulk').innerHTML=html;}
async function checkBalance(){if(!currentWallet)return alert('Generate first');try{const prov=new ethers.providers.JsonRpcProvider('https://ngn-chain.onrender.com');const bal=await prov.getBalance(currentWallet.address);alert('Balance: '+ethers.utils.formatEther(bal)+' NGN');}catch(e){alert(e.message);}}
async function claimFaucet(){
  if(!currentWallet) return alert('Generate wallet first');
  const addr=currentWallet.address;
  const logEl=document.getElementById('w-bulk');
  logEl.innerHTML='Claiming 100 NGN for '+addr+'...';
  try{
    const res=await fetch('/faucet',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address: addr})});
    const out=await res.json();
    if(out.error) throw new Error(out.error);
    logEl.innerHTML=`<div style="color:#b7ff00">SUCCESS! 100 NGN sent</div><div style="margin-top:6px">Tx: ${out.txHash}</div><div>To: ${out.to}</div>`;
    alert('100 NGN claimed! Tx: '+out.txHash);
  }catch(e){ logEl.innerHTML='Faucet Error: '+e.message; }
}
async function connectWallet(){if(!window.ethereum){alert('Open in Trust Wallet');return;}try{provider=new ethers.providers.Web3Provider(window.ethereum,'any');await window.ethereum.request({method:'eth_requestAccounts'});try{await window.ethereum.request({method:'wallet_addEthereumChain',params:[CHAIN_PARAMS]});}catch(e){}await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:CHAIN_PARAMS.chainId}]});signer=provider.getSigner();const addr=await signer.getAddress();setStatus(addr.slice(0,6)+'...'+addr.slice(-4)+' CONNECTED');log('Connected '+addr);}catch(e){log('Failed '+e.message);}}
async function compileCode(){log('Compiling...');try{const res=await fetch('/compile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:editor.getValue()})});const out=await res.json();const fileKey=Object.keys(out.contracts)[0];const contractKey=Object.keys(out.contracts[fileKey])[0];compiled=out.contracts[fileKey][contractKey];log('Compiled');}catch(e){log('Error '+e.message);}}
async function deployContract(){if(!compiled){log('Compile first');return;}if(!signer){log('Connect wallet');return;}try{log('Deploying...');const f=new ethers.ContractFactory(compiled.abi,compiled.evm.bytecode.object,signer);const c=await f.deploy();log('Tx '+c.deployTransaction.hash);await c.deployed();log('DEPLOYED '+c.address);}catch(e){log('Failed '+e.message);}}
</script>
</body>
</html>
