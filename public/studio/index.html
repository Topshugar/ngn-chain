<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NGN Chain 777 • Studio</title>
<style>
:root{--bg:#080808;--card:#111;--border:#1e1e1e;--muted:#888;--code:#0e0e0e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--card)}
.header h2{font-size:15px;font-weight:650;letter-spacing:-0.2px}
.header a{color:#888;text-decoration:none;font-size:12px;border:1px solid var(--border);padding:6px 10px;border-radius:8px}
.main{flex:1;display:grid;grid-template-columns:1fr 380px;overflow:hidden}
@media(max-width:900px){.main{grid-template-columns:1fr;}}
.editor{display:flex;flex-direction:column;overflow:hidden}
.toolbar{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);background:#0f0f0f}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;color:#000;font-weight:600;font-size:12px;cursor:pointer}
.btn.sec{background:#0f0f0f;color:#ccc}
textarea{flex:1;width:100%;background:var(--code);color:#d6d6d6;border:0;padding:16px;font-family:JetBrains Mono,Menlo,monospace;font-size:13px;line-height:1.6;resize:none;outline:none}
.panel{background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel h4{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:12px 14px;border-bottom:1px solid var(--border)}
.log{flex:1;overflow:auto;padding:12px;font-family:monospace;font-size:12px;color:#aaa;white-space:pre-wrap}
.input{margin:10px 12px;padding:10px;background:#0a0a0a;border:1px solid var(--border);border-radius:8px;color:#fff;font-size:12px}
.row{display:flex;gap:8px;padding:0 12px 12px}
</style>
</head>
<body>
<div class="header">
<h2>NGN Chain 777 • Studio</h2>
<a href="/">Home</a>
</div>

<div class="main">
<div class="editor">
<div class="toolbar">
<button class="btn" onclick="compile()">Compile</button>
<button class="btn sec" onclick="deploy()">Deploy (Demo)</button>
</div>
<textarea id="code" spellcheck="false">// SPDX-License-Identifier: MIT
pragma solidity ^0.8.19;

contract Counter {
    uint256 public count;

    function increment() public {
        count += 1;
    }

    function set(uint256 _count) public {
        count = _count;
    }
}
</textarea>
</div>

<div class="panel">
<h4>Output</h4>
<div id="output" class="log">Ready • Chain ID 777
RPC: https://ngn-chain.onrender.com
</div>
<h4 style="border-top:1px solid var(--border)">Constructor Args (optional)</h4>
<input id="args" class="input" placeholder="e.g. 100" />
<div class="row">
<button class="btn sec" style="flex:1" onclick="clearLog()">Clear</button>
</div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
function log(msg){ $('output').innerText += '\n' + msg; $('output').scrollTop = $('output').scrollHeight; }
function clearLog(){ $('output').innerText='Ready • Chain ID 777'; }

async function compile(){
  const source = $('code').value;
  log('> Compiling...');
  try{
    const res = await fetch('/compile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source})});
    const data = await res.json();
    if(data.error){ log('Error: '+data.error); return; }
    log(`Compiled: ${data.contractName}`);
    log(`Bytecode: ${data.bytecode.slice(0,66)}...`);
    window.lastBuild = data;
  }catch(e){ log('Compile failed: '+e.message); }
}

async function deploy(){
  if(!window.lastBuild){ log('Compile first'); return; }
  log('> Deploying to 777 (simulated)...');
  log(`ABI entries: ${window.lastBuild.abi.length}`);
  log('Deployed: 0x'+[...Array(40)].map(()=>Math.floor(Math.random()*16).toString(16)).join(''));
}
</script>
</body>
</html>
