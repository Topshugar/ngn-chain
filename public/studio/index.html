<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NGN DARK STUDIO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
<script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js"></script>
<style>body{margin:0;background:#000;color:#0f0;font-family:monospace}#top{padding:10px;border-bottom:1px solid #0f0;display:flex;justify-content:space-between}#editor{height:50vh;border:1px solid #0f0;margin:8px}#ctrl{display:flex;gap:6px;padding:0 8px}button{background:#000;color:#0f0;border:1px solid #0f0;padding:14px;flex:1;font-family:monospace;font-weight:bold}#log{background:#050505;border:1px solid #0f0;margin:8px;padding:10px;height:30vh;overflow:auto;font-size:12px}</style>
</head>
<body>
<div id="top"><b>NGN_DARKNET // 777</b><span style="color:red">● SERVER COMPILER</span></div>
<div id="editor"></div>
<div id="ctrl"><button onclick="compile()">> COMPILE</button><button onclick="deploy()">> DEPLOY</button></div>
<div id="log">Ready...</div>
<script>
let editor, compiled=null;
const code = `// SPDX-License-Identifier: MIT
pragma solidity ^0.8.19;
contract NGN_Dark {
    string public name = "Naira Dark Token";
    string public symbol = "NGN";
    uint8 public decimals = 18;
    uint256 public totalSupply;
    address public owner;
    mapping(address => uint256) public balanceOf;
    event Transfer(address a,address b,uint256 v);
    constructor(){owner=msg.sender;totalSupply=1000000000*10**18;balanceOf[msg.sender]=totalSupply;}
    function transfer(address to,uint256 v) public returns(bool){require(balanceOf[msg.sender]>=v);balanceOf[msg.sender]-=v;balanceOf[to]+=v;emit Transfer(msg.sender,to,v);return true;}
}`;
require.config({paths:{vs:'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs'}});
require(['vs/editor/editor.main'],()=>{editor=monaco.editor.create(document.getElementById('editor'),{value:code,language:'solidity',theme:'vs-dark'})});
function log(m){const l=document.getElementById('log');l.innerHTML+=`<br>> ${m}`;l.scrollTop=l.scrollHeight}
async function compile(){
log('Compiling on server...');
const r=await fetch('/compile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:editor.getValue()})});
const out=await r.json();
if(out.errors){out.errors.forEach(e=>log(e.formattedMessage)); if(out.errors.some(e=>e.severity=='error')) return;}
compiled=out.contracts['NGN.sol']['NGN_Dark'];
log(`COMPILED ✅ ${compiled.evm.bytecode.object.length/2} bytes`);
}
async function deploy(){
if(!compiled){log('COMPILE first!');return}
if(!window.ethereum){log('Open in MetaMask!');return}
try{
await window.ethereum.request({method:'eth_requestAccounts'});
await window.ethereum.request({method:'wallet_addEthereumChain',params:[{chainId:'0x'+(777).toString(16),chainName:'NGN Dark',rpcUrls:['https://ngn-chain.onrender.com'],nativeCurrency:{name:'NGN',symbol:'NGN',decimals:18}}]});
const provider=new ethers.providers.Web3Provider(window.ethereum);
const signer=provider.getSigner();
const factory=new ethers.ContractFactory(compiled.abi,compiled.evm.bytecode.object,signer);
const c=await factory.deploy();
log('Tx: '+c.deployTransaction.hash);
await c.deployed();
log('DEPLOYED ✅ '+c.address);
}catch(e){log('Error: '+e.message)}
}
</script>
</body>
</html>
