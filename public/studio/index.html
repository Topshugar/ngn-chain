<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NGN Studio - Deploy on Chain 777</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
body{margin:0;background:#0a0a0b;color:#e5e5e5;font-family:'JetBrains Mono',monospace}
.top{border-bottom:1px solid #222;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:#000;position:sticky;top:0}
.logo{color:#00ff41;font-weight:700}
#editor{height:50vh;border:1px solid #222;margin:12px;border-radius:10px;overflow:hidden}
.row{display:flex;gap:8px;padding:0 12px}
button{flex:1;background:#111;color:#fff;border:1px solid #222;padding:14px;border-radius:10px;font-family:'JetBrains Mono';font-weight:700;font-size:12px;cursor:pointer}
button.green{background:#00ff41;color:#000;border-color:#00ff41}
#log{background:#111;border:1px solid #222;margin:12px;padding:12px;border-radius:10px;height:28vh;overflow:auto;font-size:11px;line-height:1.7}
a{color:#00ff41;text-decoration:none}
</style>
</head>
<body>
<div class="top"><span class="logo">NGN STUDIO [777]</span><span id="status" style="font-size:10px;border:1px solid #222;padding:4px 8px;border-radius:20px">NOT CONNECTED</span></div>
<div id="editor"></div>
<div class="row">
<button onclick="connect()">CONNECT WALLET</button>
<button onclick="compile()">COMPILE</button>
<button class="green" onclick="deploy()">DEPLOY</button>
</div>
<div id="log">Ready.<br>> 1. Connect Wallet (adds NGN Chain 777)<br>> 2. Compile<br>> 3. Deploy<br>> Open in MetaMask Browser for best experience</div>

<script>
let editor, compiled=null, provider, signer;

const defaultCode = `// SPDX-License-Identifier: MIT
pragma solidity ^0.8.19;
contract NGN {
    string public name = "Naira Token";
    string public symbol = "NGN";
    uint8 public decimals = 18;
    uint256 public totalSupply;
    address public owner;
    mapping(address=>uint256) public balanceOf;
    event Transfer(address indexed from, address indexed to, uint256 value);
    constructor(){
        owner = msg.sender;
        totalSupply = 1000000000 * 10**18;
        balanceOf[msg.sender] = totalSupply;
        emit Transfer(address(0), msg.sender, totalSupply);
    }
    function transfer(address to, uint256 amount) public returns(bool){
        require(balanceOf[msg.sender] >= amount, "insufficient");
        balanceOf[msg.sender] -= amount;
        balanceOf[to] += amount;
        emit Transfer(msg.sender, to, amount);
        return true;
    }
}`;

require.config({paths:{vs:'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs'}});
require(['vs/editor/editor.main'],()=>{
  editor = monaco.editor.create(document.getElementById('editor'),{
    value: defaultCode, language:'solidity', theme:'vs-dark', fontSize:12, minimap:{enabled:false}
  });
});

function log(m){ const l=document.getElementById('log'); l.innerHTML+=`<br>> ${m}`; l.scrollTop=l.scrollHeight; }

async function connect(){
  if(!window.ethereum){ log('Please open this link inside MetaMask / Trust Wallet browser app'); return; }
  try{
    provider = new ethers.providers.Web3Provider(window.ethereum);
    await window.ethereum.request({method:'eth_requestAccounts'});
    await window.ethereum.request({method:'wallet_addEthereumChain',params:[{chainId:'0x'+(777).toString(16),chainName:'NGN Chain',rpcUrls:['https://ngn-chain.onrender.com'],nativeCurrency:{name:'NGN',symbol:'NGN',decimals:18},blockExplorerUrls:['https://ngn-chain.onrender.com']}]});
    signer = provider.getSigner();
    const addr = await signer.getAddress();
    document.getElementById('status').innerText = addr.slice(0,6)+'...'+addr.slice(-4)+' CONNECTED';
    log('Connected: '+addr);
    log('NGN Chain 777 added ✅');
  }catch(e){ log('Connect error: '+e.message); }
}

async function compile(){
  log('Compiling on server...');
  const res = await fetch('/compile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:editor.getValue()})});
  const out = await res.json();
  if(out.errors){ out.errors.forEach(e=>log(e.formattedMessage)); if(out.errors.some(x=>x.severity=='error')) return; }
  compiled = out.contracts['NGN.sol']['NGN'];
  log(`COMPILED ✅ ${compiled.evm.bytecode.object.length/2} bytes - Ready to deploy`);
}

async function deploy(){
  if(!compiled){ log('Compile first!'); return; }
  if(!signer){ log('Connect wallet first!'); return; }
  try{
    log('Deploying to NGN 777...');
    const factory = new ethers.ContractFactory(compiled.abi, compiled.evm.bytecode.object, signer);
    const c = await factory.deploy();
    log('Tx: '+c.deployTransaction.hash);
    await c.deployed();
    log('DEPLOYED ✅ ADDRESS: '+c.address);
    log('SAVE THIS ADDRESS - This is your token!');
  }catch(e){ log('Deploy error: '+e.message); }
}
</script>
</body>
</html>
