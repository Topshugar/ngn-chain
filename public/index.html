<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NGN Chain 777</title>
<link rel="icon" href="/logo.svg" />
<style>
:root{--bg:#0a0a0a;--card:#111;--border:#1f1f1f;--muted:#888;--text:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:460px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.brand img{width:40px;height:40px;border-radius:10px;background:#151515}
.brand h1{font-size:22px;letter-spacing:-0.5px;font-weight:700}
.brand span{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stat{background:#0f0f0f;border:1px solid var(--border);border-radius:12px;padding:12px}
.stat label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.stat b{font-size:14px;font-weight:600}
.label{font-size:13px;color:var(--muted);margin:0 0 8px 2px}
.input{width:100%;padding:14px 14px;background:#0a0a0a;border:1px solid var(--border);border-radius:12px;color:#fff;font-size:14px;outline:none}
.input:focus{border-color:#333}
.btn{width:100%;margin-top:12px;padding:14px;background:#fff;color:#000;border:0;border-radius:12px;font-weight:650;font-size:14px;cursor:pointer}
.btn:disabled{opacity:.5}
.note{margin-top:12px;font-size:12.5px;color:var(--muted);line-height:1.4;min-height:18px;word-break:break-all}
.links{display:flex;gap:10px;margin-top:18px}
.links a{flex:1;text-align:center;padding:11px;background:#0f0f0f;border:1px solid var(--border);border-radius:12px;color:#ccc;text-decoration:none;font-size:13px;font-weight:500}
.links a:hover{background:#151515;color:#fff}
.footer{margin-top:16px;text-align:center;font-size:11px;color:#555}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="/logo.svg" alt="" />
    <div>
      <h1>NGN Chain 777</h1>
      <span>EVM • Chain ID 777</span>
    </div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><label>Network</label><b id="net">Checking</b></div>
      <div class="stat"><label>Block Height</label><b id="block">—</b></div>
    </div>

    <div class="label">Wallet address</div>
    <input id="addr" class="input" placeholder="0x..." autocomplete="off" spellcheck="false" />

    <button id="claimBtn" class="btn" onclick="claim()">Claim 100 NGN</button>
    <div id="msg" class="note"></div>

    <div class="links">
      <a href="/explorer">Explorer</a>
      <a href="/studio">Studio</a>
      <a href="/trader">Trader</a>
    </div>
  </div>
  <div class="footer">ngn-chain.onrender.com • RPC endpoint active</div>
</div>

<script>
const $ = (id) => document.getElementById(id);

async function loadStats(){
  try{
    const res = await fetch('/api/stats');
    const data = await res.json();
    $('net').innerText = 'Operational';
    $('block').innerText = data.blockNumber ?? '—';
  }catch{
    $('net').innerText = 'Offline';
  }
}

async function claim(){
  const address = $('addr').value.trim();
  const btn = $('claimBtn');
  const msg = $('msg');
  if(!/^0x[a-fA-F0-9]{40}$/.test(address)){
    msg.innerText = 'Enter a valid 0x address';
    return;
  }
  btn.disabled = true;
  btn.innerText = 'Processing...';
  msg.innerText = '';
  try{
    const res = await fetch('/faucet',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({address})
    });
    const data = await res.json();
    if(data.success){
      msg.innerText = `Success • ${data.txHash}`;
      loadStats();
    }else{
      msg.innerText = data.error || 'Request failed';
    }
  }catch(e){
    msg.innerText = 'Network error';
  }finally{
    btn.disabled = false;
    btn.innerText = 'Claim 100 NGN';
  }
}

loadStats();
</script>
</body>
</html>
