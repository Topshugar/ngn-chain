<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NGN Chain 777 • Explorer</title>
<style>
:root{--bg:#080808;--card:#111;--border:#1e1e1e;--muted:#888}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif;padding:16px}
.header{max-width:1100px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:center}
.header h2{font-size:18px;letter-spacing:-0.3px}
.header a{color:#888;text-decoration:none;font-size:13px;border:1px solid var(--border);padding:8px 12px;border-radius:10px}
.grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 340px;gap:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #151515;font-size:13px;color:#aaa}
.stat b{color:#fff}
.input{width:100%;padding:12px;background:#0a0a0a;border:1px solid var(--border);border-radius:10px;color:#fff;font-size:13px}
.btn{margin-top:10px;width:100%;padding:11px;background:#fff;color:#000;border:0;border-radius:10px;font-weight:650;font-size:13px;cursor:pointer}
.list{margin-top:12px;max-height:420px;overflow:auto}
.item{padding:10px 0;border-bottom:1px solid #151515;font-family:monospace;font-size:12px;color:#aaa}
.item b{color:#fff}
.note{font-size:12px;color:var(--muted);margin-top:10px;word-break:break-all}
</style>
</head>
<body>
<div class="header">
<h2>NGN Chain 777 • Explorer</h2>
<a href="/">Home</a>
</div>

<div class="grid">
<div class="card">
<div class="label">Chain Overview</div>
<div class="stat"><span>Chain ID</span><b>777</b></div>
<div class="stat"><span>Native Token</span><b>NGN</b></div>
<div class="stat"><span>Block Height</span><b id="block">—</b></div>
<div class="stat"><span>RPC Status</span><b id="status">—</b></div>
<div class="stat"><span>Validators</span><b id="vals">—</b></div>

<div style="margin-top:16px">
<div class="label">Lookup</div>
<input id="hash" class="input" placeholder="Tx hash or address (0x...)" />
<button class="btn" onclick="lookup()">Search</button>
<div id="result" class="note"></div>
</div>
</div>

<div class="card">
<div class="label">Recent Transactions</div>
<div id="txs" class="list">
<div class="item">Loading...</div>
</div>
</div>
</div>

<script>
async function load(){
 try{
  const r=await fetch('/api/stats'); const j=await r.json();
  document.getElementById('block').innerText=j.blockNumber;
  document.getElementById('status').innerText='Operational';
  document.getElementById('vals').innerText=j.validators ?? '—';
 }catch{
  document.getElementById('status').innerText='Offline';
 }
}
async function lookup(){
 const v=document.getElementById('hash').value.trim();
 const out=document.getElementById('result');
 if(!v){ out.innerText='Enter hash or address'; return; }
 out.innerText='Querying...';
 if(v.length===66){
   try{
     const body={jsonrpc:'2.0',id:1,method:'eth_getTransactionByHash',params:[v]};
     const res=await fetch('/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
     const data=await res.json();
     out.innerText = data.result ? JSON.stringify(data.result,null,2) : 'Transaction not found';
   }catch(e){ out.innerText='Error: '+e.message; }
 }else{
   try{
     const body={jsonrpc:'2.0',id:1,method:'eth_getBalance',params:[v,'latest']};
     const res=await fetch('/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
     const data=await res.json();
     out.innerText = data.result ? `Balance: ${data.result}` : 'Address not found or 0';
   }catch(e){ out.innerText='Error: '+e.message; }
 }
}
// Mock recent list from /api/stats or just show block ticker
setInterval(load, 5000);
load();
</script>
</body>
</html>
